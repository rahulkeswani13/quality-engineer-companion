[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-engineer-companion"
version = "0.1.0"
description = "Quality Engineer Companion (RAG + LangGraph, lot hold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-dotenv>=1.0",
  "pydantic>=2.8",
  "numpy>=2.0",
  "rank-bm25>=0.2.2",
  "langgraph>=0.2.45",
  "langgraph-checkpoint-sqlite>=2.0",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
rerank = ["sentence-transformers>=3.0"]

[project.scripts]
companion = "companion.cli:main"

[tool.setuptools.packages.find]
include = ["companion*"]

[tool.setuptools.package-data]
companion = ["corpus/*.md", "eval/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
